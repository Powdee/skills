<!doctype html>
<!-- Minimal, complete <motion-graphic> walkthrough. Copy it as the skeleton for a new piece:
     title card → question typed into an input → camera pulls back to the product → rows sort by
     priority → the pointer clicks the top row → its detail counts up → camera pushes in → end card.
     Serve the folder over HTTP (ES modules do not load from file://), e.g. `python3 -m http.server`. -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Motion template</title>
  <link rel="stylesheet" href="../engine/motion-engine.css" />
  <style>
    :root { --ink: #171817; --muted: #737b79; --frame: #eef0eb; --panel: #fff; --accent: #00617e; --red: #bd5c4d; --amber: #b69b4b; --green: #5f8b6d; }
    body { margin: 0; padding: 32px; background: #032028; font-family: system-ui, sans-serif; }
    .demo { max-width: 1120px; margin: 0 auto; border-radius: 16px; overflow: hidden; }
    .mg { color: var(--ink); }
    .mg-frame { background: var(--frame); }

    /* World: the product UI the camera moves across (1280×720 design pixels). */
    .mg-world { display: grid; grid-template-columns: 300px 1fr 340px; gap: 8px; padding: 8px; background: var(--frame); }
    .mg-world > :not(.paper) { position: relative; z-index: 1; min-width: 0; }
    .paper { position: absolute; inset: -720px -1280px; z-index: 0; background: radial-gradient(rgb(23 24 23 / 0.06) 0.8px, transparent 1px) 0 0 / 14px 14px, #fbfbfa; }
    .panel { position: relative; overflow: hidden; border-radius: 9px; background: var(--panel); }
    .panel h3 { margin: 0; padding: 18px 16px; border-bottom: 1px solid rgb(23 24 23 / 0.1); font-size: 15px; }
    .rows { position: relative; height: 460px; margin: 8px 10px; padding: 0; list-style: none; }
    .row { position: absolute; top: calc(var(--slot, 0) * 46px); left: 0; right: 0; display: flex; align-items: center; gap: 10px; height: 42px; padding: 0 10px; border-radius: 7px; background: var(--panel); font-size: 13px; isolation: isolate; }
    .row.is-top { z-index: 2; }
    .row-active { position: absolute; inset: 0; z-index: -1; border: 1px solid rgb(0 97 126 / 0.2); border-radius: 7px; box-shadow: 0 4px 12px rgb(0 63 82 / 0.08); }
    .score { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 6px; color: #fff; font-size: 11px; font-weight: 600; }
    .score.red { background: var(--red); } .score.amber { background: var(--amber); } .score.green { background: var(--green); }
    .detail-body { display: grid; gap: 12px; padding: 16px; }
    .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .kpi { padding: 12px; border: 1px solid rgb(23 24 23 / 0.08); border-radius: 8px; background: #fbfbfa; }
    .kpi > span { display: block; color: var(--muted); font-size: 10px; font-weight: 700; text-transform: uppercase; }
    .kpi strong { display: block; margin-top: 6px; font-size: 22px; }
    .chart { display: flex; align-items: flex-end; gap: 12px; height: 220px; padding: 16px; border-radius: 8px; background: #fbfbfa; }
    .chart i { flex: 1; border-radius: 4px 4px 0 0; background: var(--accent); }
    .assistant { display: flex; flex-direction: column; }
    .assistant .skin { position: absolute; inset: 0; border-radius: 9px; background: var(--panel); }
    .answer { position: relative; padding: 20px 16px; font-size: 14px; line-height: 1.5; }
    .input { position: absolute; right: 16px; bottom: 16px; left: 16px; display: flex; align-items: center; gap: 8px; min-height: 42px; padding: 7px 7px 7px 12px; border: 2px solid transparent; border-radius: 11px; font-size: 13px; }
    .field { position: relative; display: grid; flex: 1; grid-template-columns: minmax(0, 1fr); }
    .field > * { grid-area: 1 / 1; }
    .placeholder { color: #858985; }
    .send { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--ink); color: #fff; font-size: 13px; }
    .mg .send { transform: scale(calc(var(--p) * (1 - 0.2 * var(--k)))); }

    /* Stage-space overlays: title and end cards stay put while the camera moves. */
    .cards { position: absolute; inset: 0; z-index: 3; display: grid; place-items: center; pointer-events: none; }
    .card { grid-area: 1 / 1; margin: 0; font-size: 60px; font-weight: 400; line-height: 1.08; text-align: center; }
    .card .soft { display: block; color: rgb(23 24 23 / 0.46); }
    .end-backdrop { position: absolute; inset: 0; background: #fbfbfa; }
  </style>
</head>
<body>
  <div class="demo">
    <motion-graphic class="mg" data-number-locale="en-GB">
      <script type="application/json" data-storyboard>
        {
          "stage": { "width": 1280, "height": 720 },
          "start": -3,
          "duration": 11,
          "chapters": [
            { "at": -3, "settle": -1.2, "label": "Hook" },
            { "at": 0, "label": "Question" },
            { "at": 2.5, "label": "Portfolio" },
            { "at": 6.2, "label": "Detail" },
            { "at": 9, "label": "End" }
          ],
          "camera": [
            { "at": [0, 0], "focus": "input", "scale": 2.2 },
            { "at": [2.5, 4.1], "focus": "world", "scale": 1 },
            { "at": [6.2, 7.2], "focus": "detail", "pad": 24 },
            { "at": [8.2, 9], "focus": "world", "scale": 1 }
          ],
          "cursor": {
            "moves": [
              { "at": [4.4, 4.4], "focus": "detail", "ax": 0.3, "ay": 0.6 },
              { "at": [4.5, 5.2], "focus": "top-row", "ax": 0.45 }
            ],
            "visible": [[4.4, 6.0]],
            "clicks": [5.4]
          },
          "sfx": [{ "at": 5.4, "sound": "click" }]
        }
      </script>
      <div class="mg-frame">
        <div class="mg-stage" aria-hidden="true">
          <div class="mg-world">
            <div class="paper" data-out="2.5 1.2 io"></div>
            <aside class="panel fx-up" data-in="2.9 .6">
              <h3>To prioritise</h3>
              <ul class="rows">
                <!-- data-slot: arrival slot → sorted slot, then when and how long the sort runs -->
                <li class="row fx-up is-top" data-in="3.1 .4" data-slot="3 0 4.0 .9 io" data-focus="top-row"><span class="row-active" data-in="5.45 .25"></span><span class="score red">39</span>Building A</li>
                <li class="row fx-up" data-in="3.15 .4" data-slot="0 1 4.05 .9 io"><span class="score red">54</span>Building B</li>
                <li class="row fx-up" data-in="3.2 .4" data-slot="2 2 4.1 .9 io"><span class="score amber">68</span>Building C</li>
                <li class="row fx-up" data-in="3.25 .4" data-slot="1 3 4.15 .9 io"><span class="score green">82</span>Building D</li>
              </ul>
            </aside>
            <section class="panel fx-up" data-in="3.0 .6" data-focus="detail">
              <h3>Building A</h3>
              <div class="detail-body" data-in="5.5 .4">
                <div class="kpis">
                  <div class="kpi"><span>Condition</span><strong><span data-count="5.6 1.0" data-value="39">0</span> / 100</strong></div>
                  <div class="kpi"><span>Risk</span><strong>High</strong></div>
                  <div class="kpi"><span>5-year cost</span><strong><span data-count="5.7 1.0" data-value="4.8" data-decimals="1">0</span>m</strong></div>
                </div>
                <div class="chart">
                  <i class="fx-bar" style="height: 60%" data-in="6.6 .6" data-sfx="pop"></i>
                  <i class="fx-bar" style="height: 25%" data-in="6.75 .6" data-sfx="pop"></i>
                  <i class="fx-bar" style="height: 80%" data-in="6.9 .6" data-sfx="pop"></i>
                  <i class="fx-bar" style="height: 45%" data-in="7.05 .6" data-sfx="pop"></i>
                </div>
              </div>
            </section>
            <aside class="assistant">
              <div class="skin" data-in="2.6 .6"></div>
              <p class="answer fx-up" data-in="3.3 .5" data-sfx="chime">Building A first: lowest condition, highest risk.</p>
              <div class="input" data-focus="input">
                <span class="mg-ring" data-in="0.1 1.0 io"><i></i></span>
                <div class="field">
                  <span class="placeholder" data-in="0.7 .3" data-out="1.1 .12">Ask anything…</span>
                  <span class="mg-typed" data-type="1.15 2.2 2.6" data-text="What should we fix first?" data-in="1.1 .05" data-out="2.4 .15"></span>
                </div>
                <span class="send" data-in="0.8 .4 b" data-pulse="2.3 .3" data-focus="send" data-sfx="click">↑</span>
              </div>
            </aside>
          </div>
          <div class="cards">
            <h2 class="card fx-up" data-out="-0.5 .5 io">
              <span class="soft"><span class="mg-word"><span class="fx-rise" data-in="-2.8 .7">Too</span></span> <span class="mg-word"><span class="fx-rise" data-in="-2.73 .7">many</span></span> <span class="mg-word"><span class="fx-rise" data-in="-2.66 .7">buildings?</span></span></span>
              <span class="mg-word"><span class="fx-rise" data-in="-2.4 .7">Start</span></span> <span class="mg-word"><span class="fx-rise" data-in="-2.33 .7">here.</span></span>
            </h2>
            <span class="end-backdrop" data-in="9 .6 io"></span>
            <h2 class="card"><span class="mg-word"><span class="fx-rise" data-in="9.4 .7">Acme.</span></span></h2>
          </div>
          <span class="mg-ripple"></span>
          <svg class="mg-cursor" viewBox="0 0 24 24" width="24" height="24"><path d="M5 2.5v17.2l4.3-4.2 2.9 6.6 3-1.3-2.9-6.5h6.1z" /></svg>
        </div>
      </div>
      <div class="mg-controls">
        <button class="mg-toggle" type="button" data-mg-toggle data-play-label="Play" data-pause-label="Pause" data-replay-label="Replay" aria-label="Play">
          <svg class="mg-icon-play" viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z" fill="currentColor" /></svg>
          <svg class="mg-icon-pause" viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z" fill="currentColor" /></svg>
          <svg class="mg-icon-replay" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 3-6.2M4 4v5h5" fill="none" stroke="currentColor" stroke-width="2.4" /></svg>
        </button>
        <div class="mg-chapters">
          <button class="mg-chapter" type="button" data-mg-chapter aria-label="Hook"><span><i></i></span></button>
          <button class="mg-chapter" type="button" data-mg-chapter aria-label="Question"><span><i></i></span></button>
          <button class="mg-chapter" type="button" data-mg-chapter aria-label="Portfolio"><span><i></i></span></button>
          <button class="mg-chapter" type="button" data-mg-chapter aria-label="Detail"><span><i></i></span></button>
          <button class="mg-chapter" type="button" data-mg-chapter aria-label="End"><span><i></i></span></button>
        </div>
      </div>
      <!-- Optional soundtrack. The sync pairs map track seconds to storyboard seconds; without a
           voice-over use the storyboard's own pacing shifted to start at 0: [[0, start], [duration - start, duration]].
      <audio src="soundtrack.mp3" preload="none" data-sync="[[0, -3], [14, 11]]"></audio> -->
    </motion-graphic>
  </div>
  <script type="module">
    import "../engine/motion-engine.js";
    await customElements.whenDefined("motion-graphic");
    document.querySelector("motion-graphic").start();
  </script>
</body>
</html>
